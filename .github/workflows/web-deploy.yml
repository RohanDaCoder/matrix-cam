name: web-deploy

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "Trunk.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; superseded runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web app (trunk, wasm32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "v0.22.2"

      - name: Build (release)
        run: trunk build --release

      - name: Clean preload tags
        # trunk emits <link rel="preload" ... integrity="..."> for the wasm;
        # Chrome ignores SRI on wasm preloads and logs a console warning for
        # every visitor (crbug.com/981419). The hash still ships on the
        # module URL itself — drop the useless attribute.
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path
          p = Path("dist/index.html")
          t = p.read_text()
          t, n = re.subn(r'(<link[^>]*rel="(?:preload|modulepreload)"[^>]*?)\s+integrity="[^"]*"', r'\1', t)
          p.write_text(t)
          print(f"stripped integrity from {n} preload link(s)")
          EOF

      - name: Smoke-check the artifact set
        run: |
          test -f dist/index.html
          ls dist/*.wasm dist/*.js
          test "$(ls dist/*.wasm | wc -l)" -eq 1
          test "$(ls dist/*.js | wc -l)" -eq 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
