[package]
name = "matrix-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "matrix-cam"
path = "src/main.rs"

[dependencies]
matrix-core = { path = "../matrix-core" }
matrix-gui = { path = "../matrix-gui" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = "2"
semver = "1"

# Camera capture + virtual camera only exist on Windows; everything else
# (cli, config, render, auto, ui, pipeline) is platform neutral so it can be
# type-checked anywhere with plain `cargo check`.
[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10", features = ["input-native", "decoding", "camera-sync-impl"] }
virtualcam = "1"
