[package]
name = "matrix-web"
version.workspace = true
edition.workspace = true

[[bin]]
name = "matrix-cam-web"
path = "src/main.rs"

[dependencies]
matrix-core = { path = "../matrix-core", features = ["web"] }
matrix-gui = { path = "../matrix-gui" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
anyhow = "1"
log = "0.4"
console_error_panic_hook = "0.1"

# web-sys feature flags for the camera path: getUserMedia + video + canvas 2d.
[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlVideoElement",
    "HtmlCanvasElement",
    "HtmlMediaElement",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaDevices",
    "MediaTrackConstraints",
    "MediaTrackSettings",
    "Navigator",
    "CanvasRenderingContext2d",
    "ImageData",
    "Permissions",
    "PermissionState",
]

