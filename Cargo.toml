[package]
name = "matrix-cam"
version = "2.0.0"
edition = "2021"

[dependencies]
nokhwa = { version = "0.10", features = ["input-native", "decoding", "camera-sync-impl"] }
virtualcam = "1"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
