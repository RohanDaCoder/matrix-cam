[package]
name = "matrix-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
semver = "1"
# web_time replaces std Instant/Duration on wasm32 (see src/time.rs).
web-time = { version = "1", optional = true }

[features]
default = []
# Pulls in web_time; enabled only by the wasm host.
web = ["web-time"]
