[workspace]
resolver = "2"
members = [
    "crates/matrix-core",
    "crates/matrix-gui",
    "crates/matrix-cli",
    "crates/matrix-web",
]

[workspace.package]
version = "2.5.0"
edition = "2021"

# Desktop release profile (the web crate carries its own slimmer one).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
